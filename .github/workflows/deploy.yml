name: Deploy to reg.ru

# Автодеплой сайта thousandli.ru на хостинг Рег.ру по FTP.
# Срабатывает на каждый пуш в рабочую ветку + можно запустить вручную.

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

concurrency:
  group: deploy-regru
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # FTPS (шифрование). Если Рег.ру не примет — поменять на ftp.
          protocol: ftps
          # Корневая папка сайта на хостинге. Задаётся переменной репозитория
          # FTP_SERVER_DIR; по умолчанию www/thousandli.ru/test/ (тестовая копия, пока заказчик не видит)
          server-dir: ${{ vars.FTP_SERVER_DIR || 'www/thousandli.ru/test/' }}
          local-dir: ./
          # что НЕ заливать на хостинг
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            deploy/**
            README.md

      - name: Check site (DNS, HTTP, HTTPS)
        if: always()
        continue-on-error: true
        run: |
          echo "== DNS A thousandli.ru ==";  dig +short A thousandli.ru
          echo "== DNS A www ==";            dig +short A www.thousandli.ru
          echo "== DNS NS ==";               dig +short NS thousandli.ru
          echo "(сервер хостинга: 31.31.198.27)"
          for u in http://thousandli.ru/test/ https://thousandli.ru/test/ https://www.thousandli.ru/test/; do
            echo "== $u =="
            curl -sS -o /dev/null --max-time 20 \
              -w "code=%{http_code} redirect=%{redirect_url} ip=%{remote_ip}\n" "$u" || true
            curl -sS -o /dev/null --max-time 20 -L --max-redirs 5 \
              -w "  итог: code=%{http_code} url=%{url_effective} редиректов=%{num_redirects}\n" "$u" || true
          done
          echo "== SSL-сертификат =="
          echo | openssl s_client -connect thousandli.ru:443 -servername thousandli.ru 2>/dev/null \
            | openssl x509 -noout -subject -issuer -dates 2>/dev/null || echo "сертификата нет"
