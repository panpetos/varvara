name: Deploy to reg.ru

# Автодеплой сайта thousandli.ru на хостинг Рег.ру по FTP.
# Каждый пуш выкладывает изменения только на основной сайт:
#   www/thousandli.ru/ → https://thousandli.ru/
# Папка /test/ этим workflow больше не изменяется.

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

concurrency:
  group: deploy-regru
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SERVER_DIR: www/thousandli.ru/
      URL: https://thousandli.ru/
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Новый логотип, favicon и официальная почта применяются ко всем собранным страницам перед выкладкой.
      - name: Apply logo, favicon and email
        run: |
          python3 tools/apply_branding.py
          python3 tools/apply_favicon.py
          test "$(grep -l 'https://thousandli.ru/img/logo2.svg' ./*.html | wc -l)" -eq "$(find . -maxdepth 1 -name '*.html' | wc -l)"
          test "$(grep -l 'https://thousandli.ru/img/logo2.svg?v=2' ./*.html | wc -l)" -eq "$(find . -maxdepth 1 -name '*.html' | wc -l)"
          test "$(grep -l 'ТЫСЯЧА ЛИ' ./*.html | wc -l)" -eq "$(find . -maxdepth 1 -name '*.html' | wc -l)"
          test "$(grep -l 'position: static; display: flex; align-items: center; justify-content: flex-start; margin: 0 auto 0 0; transform: none' ./*.html | wc -l)" -eq "$(find . -maxdepth 1 -name '*.html' | wc -l)"
          test "$(grep -l 'mailto:school@thousandli.ru' ./*.html | wc -l)" -eq "$(find . -maxdepth 1 -name '*.html' | wc -l)"

      # На основном сайте убираем запрет индексации: meta robots на всех страницах и X-Robots-Tag в .htaccess
      - name: Open indexing for production
        run: |
          sed -i '/data-env="test"/d; /Тестовая копия: индексация закрыта/d' ./*.html
          sed -i '/# test-noindex:start/,/# test-noindex:end/d' .htaccess
          ! grep -l noindex ./*.html .htaccess
          echo "Прод: индексация открыта"

      # Stitex Captcha «Я не робот»: ключ клиента (публичный) ниже, серверный — из GitHub Secrets STITEX_SECRET_KEY.
      # Нет серверного ключа — капча выключена, формы работают как раньше.
      - name: Configure Stitex Captcha
        env:
          CAPTCHA_CLIENT: sc_94e67282f8e726ecd2b37e1715f715fc
          CAPTCHA_SERVER: ${{ secrets.STITEX_SECRET_KEY }}
        run: |
          if [ -n "$CAPTCHA_SERVER" ]; then
            sed -i "s|^const CAPTCHA_SITEKEY = '';|const CAPTCHA_SITEKEY = '$CAPTCHA_CLIENT';|" js/main.js
            grep -q "^const CAPTCHA_SITEKEY = '.\+';" js/main.js
            printf "<?php\nreturn '%s';\n" "$CAPTCHA_SERVER" > captcha-secret.php
            echo "Капча включена"
          else
            echo "::warning::Нет секрета STITEX_SECRET_KEY — капча выключена"
          fi

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ${{ env.SERVER_DIR }}
          local-dir: ./
          # что НЕ заливать на хостинг (папки test/ и video/ на сервере не трогаются)
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            deploy/**
            README.md
            CLAUDE.md
            src/**
            tools/**
            data/**
            video-new/**

      # Тестовая копия /test/ больше не нужна (2026-10-13, по просьбе заказчика): убираем всё, кроме test/video/
      # (там исходники видео для workflow «Optimize video on hosting»). Если копии уже нет — шаг ничего не делает.
      - name: Remove /test copy from hosting
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq lftp >/dev/null
          LFTP="lftp -u $FTP_USERNAME,$FTP_PASSWORD $FTP_SERVER"
          SET="set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate no; set net:max-retries 2"
          items=$($LFTP -e "$SET; cls -1 -F -a www/thousandli.ru/test/; bye" 2>/dev/null | sed 's|^.*/test/||' | grep -v '^$' || true)
          echo "в test/: $(echo "$items" | tr '\n' ' ')"
          for it in $items; do
            case "$it" in video/|./|../|.|..) continue ;; esac
            case "$it" in
              */) $LFTP -e "$SET; rm -r 'www/thousandli.ru/test/$it'; bye" ;;
              *)  $LFTP -e "$SET; rm 'www/thousandli.ru/test/$it'; bye" ;;
            esac
            echo "удалено: test/$it"
          done
          echo -n "${URL}test/index.html → "; curl -sS -o /dev/null -w "%{http_code}\n" --max-time 20 "${URL}test/index.html" || true

      # Правки текстов из админки (admin.php) хранятся на хостинге: после выкладки страницы снова «исходные» — возвращаем правки
      - name: Reapply admin text edits
        continue-on-error: true
        run: |
          sleep 5
          # хостинг сначала отдаёт страницу-проверку с cookie RCPC и переходом ?attempt=1 — проходим её
          jar=$(mktemp)
          curl -sS --max-time 30 -c "$jar" -b "$jar" -o /dev/null "${URL}admin.php?reapply=1"
          echo -n "admin.php?reapply=1 → "
          res=$(curl -sS --max-time 30 -c "$jar" -b "$jar" "${URL}admin.php?reapply=1&attempt=1")
          echo "$res"
          # ответ «ok N» — правки возвращены; иначе шаг краснеет (они всё равно вернутся при открытии вкладки «Тексты» в админке)
          case "$res" in ok*) ;; *) echo "::warning::правки текстов из админки не возвращены — откройте admin.php → Тексты"; exit 1 ;; esac

      # Видео лежит только на хостинге (в git его нет): при необходимости копируем его из test/video
      - name: Copy founder video to production
        run: |
          for f in founder-ru.mp4 founder-ru-poster.webp; do
            if curl -sS --ssl-reqd --insecure -I -u "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$FTP_SERVER/www/thousandli.ru/video/$f" >/dev/null 2>&1; then
              echo "уже есть: video/$f"; continue
            fi
            curl -sS --ssl-reqd --insecure -u "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$FTP_SERVER/www/thousandli.ru/test/video/$f" -o "$f"
            curl -sS --ssl-reqd --insecure --ftp-create-dirs -u "$FTP_USERNAME:$FTP_PASSWORD" -T "$f" "ftp://$FTP_SERVER/www/thousandli.ru/video/$f"
            echo "скопировано: video/$f"
          done

      # Английская запись основателя (для en/ и zh/): один раз сжимаем исходник из test/video так же,
      # как workflow «Optimize video on hosting», и кладём в video/. Заливаем через .part + переименование,
      # чтобы прерванный деплой не оставил обрезанный файл. Уже есть — шаг ничего не делает.
      - name: Prepare English founder video
        env:
          SRC: Varvara English Version.mp4
          DST: founder-en
        run: |
          base="ftp://$FTP_SERVER/www/thousandli.ru/video"
          if curl -sS --ssl-reqd --insecure -I -u "$FTP_USERNAME:$FTP_PASSWORD" "$base/$DST.mp4" >/dev/null 2>&1; then
            echo "уже есть: video/$DST.mp4"; exit 0
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg webp > /dev/null
          ENC=$(python3 -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["SRC"]))')
          curl -sS --ssl-reqd --insecure -u "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$FTP_SERVER/www/thousandli.ru/test/video/$ENC" -o src.mp4
          ffmpeg -hide_banner -loglevel error -y -i src.mp4 \
            -vf "scale=w='min(iw,1920)':h='min(ih,1920)':force_original_aspect_ratio=decrease,scale=trunc(iw/2)*2:trunc(ih/2)*2" \
            -c:v libx264 -preset slow -crf 25 -profile:v high -pix_fmt yuv420p \
            -c:a aac -b:a 128k -ac 2 -movflags +faststart "$DST.mp4"
          ffmpeg -hide_banner -loglevel error -y -ss 2 -i "$DST.mp4" -frames:v 1 poster.png
          cwebp -quiet -q 80 poster.png -o "$DST-poster.webp"
          ls -l "$DST.mp4" "$DST-poster.webp"
          for f in "$DST-poster.webp" "$DST.mp4"; do
            curl -sS --ssl-reqd --insecure --ftp-create-dirs -u "$FTP_USERNAME:$FTP_PASSWORD" -T "$f" "$base/$f.part" \
              -Q "-RNFR $f.part" -Q "-RNTO $f"
            echo "залито: video/$f"
          done

      # Новые записи основателя (28.10.2026, прислала Варвара): уже сжатые лежат в git в video-new/,
      # заливаем в video/ под новыми именами (founder-ru-2, founder-en-2), чтобы браузеры не показывали старое из кеша.
      # Уже есть на хостинге — пропускаем.
      - name: Upload new founder videos
        run: |
          base="ftp://$FTP_SERVER/www/thousandli.ru/video"
          for p in video-new/*; do
            f=$(basename "$p")
            if curl -sS --ssl-reqd --insecure -I -u "$FTP_USERNAME:$FTP_PASSWORD" "$base/$f" >/dev/null 2>&1; then
              echo "уже есть: video/$f"; continue
            fi
            curl -sS --ssl-reqd --insecure --ftp-create-dirs -u "$FTP_USERNAME:$FTP_PASSWORD" -T "$p" "$base/$f.part" \
              -Q "-RNFR $f.part" -Q "-RNTO $f"
            echo "залито: video/$f"
          done

      - name: Check site
        if: always()
        continue-on-error: true
        run: |
          echo "== $URL =="
          curl -sS -o /dev/null --max-time 20 -L -w "code=%{http_code} url=%{url_effective}\n" "$URL" || true
          for page in kids.html founder.html 404.html robots.txt sitemap.xml video/founder-ru-2.mp4 video/founder-en-2.mp4; do
            curl -sS -o /dev/null -I --max-time 20 -w "$page: %{http_code}\n" "$URL$page" || true
          done
          echo "== редиректы =="
          curl -sS -o /dev/null --max-time 20 -w "http → %{redirect_url}\n" "http://thousandli.ru/" || true
          curl -sS -o /dev/null --max-time 20 -w "www → %{redirect_url}\n" "https://www.thousandli.ru/" || true
          echo "== индексация основного сайта =="
          curl -sSI --max-time 20 "$URL" | grep -i "x-robots-tag" || echo "X-Robots-Tag нет"
          curl -sS --max-time 20 "$URL" | grep -o '<meta name="robots"[^>]*>' || echo "meta robots нет"
          curl -sS --max-time 20 "$URL" | grep -o '<title>[^<]*' || true
          echo "== send.php (запрос-ловушка: письмо не отправляется) =="
          curl -sS --max-time 20 -X POST -d "website=bot&name=Test&phone=79990000000&consent=1" "${URL}send.php" || true
          echo
          echo "== капча =="
          curl -sS --max-time 20 "${URL}js/main.js" | grep -q "^const CAPTCHA_SITEKEY = '.\+';" && echo "ключ клиента в main.js есть" || echo "капча выключена (ключа нет)"
          curl -sS -o /dev/null --max-time 20 -w "captcha-secret.php снаружи: %{http_code}\n" "${URL}captcha-secret.php" || true
          if curl -sS --max-time 20 "${URL}js/main.js" | grep -q "^const CAPTCHA_SITEKEY = '.\+';"; then
            echo -n "заявка без галочки: "; curl -sS --max-time 20 -X POST -d "name=Test&phone=79990000000&consent=1" "${URL}send.php" || true; echo
          fi
          echo | openssl s_client -connect thousandli.ru:443 -servername thousandli.ru 2>/dev/null \
            | openssl x509 -noout -subject -dates 2>/dev/null || echo "сертификата нет"
