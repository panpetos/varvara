    <section class="steps" aria-labelledby="steps-title">
      <div class="steps__inner">
        <picture>
          <source media="(max-width: 1023px)" srcset="img/m/steps-cat.webp" width="191" height="280">
          <img class="steps__decor steps__decor--cat" src="img/steps/cat.webp" width="416" height="532" alt="" loading="lazy">
        </picture>
        <picture>
          <source media="(max-width: 1023px)" srcset="img/m/steps-lantern.webp" width="141" height="141">
          <img class="steps__decor steps__decor--lantern" src="img/steps/lantern.webp" width="225" height="218" alt="" loading="lazy">
        </picture>
        <img class="steps__decor steps__decor--work" src="img/steps/sticker-work.webp" width="102" height="53" alt="" loading="lazy">
        <img class="steps__decor steps__decor--travel" src="img/steps/sticker-travel.webp" width="106" height="49" alt="" loading="lazy">

        <picture>
          <source media="(max-width: 1023px)" srcset="img/m/heart.svg" width="88" height="86">
          <img class="steps__decor steps__decor--heart" src="img/steps/heart.webp" width="118" height="111" alt="" loading="lazy">
        </picture>
        {{^summary}}        <h2 class="steps__title" id="steps-title">за&nbsp;4&nbsp;шага <br>подберём программу <br>для ваших целей</h2>
        <button class="btn btn--gold steps__btn" type="button" data-quiz-open aria-haspopup="dialog" aria-controls="quiz">Подобрать программу</button>
{{/summary}}{{#summary}}        <h2 class="steps__title" id="steps-title">подведём итог: <br>4&nbsp;вопроса&nbsp;— <br>и&nbsp;ваш план готов</h2>
        <button class="btn btn--gold steps__btn" type="button" data-quiz-open aria-haspopup="dialog" aria-controls="quiz">Составить план</button>
{{/summary}}
      </div>
    </section>
